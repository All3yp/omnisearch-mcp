[project]
name = "omnisearch-mcp"
version = "0.1.0"
description = "MCP server for searching IEEE Xplore, arXiv, ACM (via CrossRef), and a local PDF library."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "all3yp" }]
keywords = ["mcp", "ieee", "arxiv", "acm", "crossref", "research", "papers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pypdf>=4.3.0",
    "python-dotenv>=1.0.1",
    "playwright>=1.40.0",
    "cloakbrowser>=0.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
]

[project.scripts]
omnisearch-mcp = "omnisearch_mcp:main"
omnisearch-capes-login = "omnisearch_mcp.scripts.capes_login:main"
omnisearch-scite-login = "omnisearch_mcp.scripts.scite_login:main"
omnisearch-consensus-login = "omnisearch_mcp.scripts.consensus_login:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::RuntimeWarning",
]

[dependency-groups]
dev = [
    "reportlab>=4.5.0",
]
